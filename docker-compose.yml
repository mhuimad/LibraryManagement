services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_password123 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  dacpac-deploy:
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      TARGET_CONNECTION_STRING: "Server=sqlserver,1433;Initial Catalog=LibraryManagement;User ID=sa;Password=Your_password123;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/LibraryManagement.Api/Dockerfile
    environment:
      ConnectionStrings__LibraryManagement: "Server=sqlserver,1433;Database=LibraryManagement;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
    ports:
      - "8080:8080"
    depends_on:
      dacpac-deploy:
        condition: service_completed_successfully
